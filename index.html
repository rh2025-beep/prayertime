  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only register Service Worker on web, NOT inside Capacitor native Android/iOS app
      if ('serviceWorker' in navigator) {
        const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        if (isNative) {
          // Unregister any active service worker & delete cached assets in native app to prevent stale bundle loading
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          }).catch(err => console.warn('SW unregister error:', err));

          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.forEach(key => caches.delete(key));
            }).catch(() => {});
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('SW Registered', reg))
              .catch(err => console.error('SW Registration Failed', err));
          });
        }
      }
    </script>
  </body>
